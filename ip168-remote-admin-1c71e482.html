<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>IP168 控制台</title>
  <script id="ip168-bootstrap-anchor"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #202028;
      --panel: rgba(255, 255, 255, 0.035);
      --panel-soft: rgba(255, 255, 255, 0.055);
      --line: rgba(255, 255, 255, 0.78);
      --line-strong: rgba(255, 255, 255, 0.96);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.62);
      --brand: rgba(255, 255, 255, 0.92);
      --brand-strong: rgba(255, 255, 255, 0.96);
      --blue: rgba(255, 255, 255, 0.82);
      --red: #ffd1d1;
      --amber: #ffe1ad;
      --control-bg: rgba(255, 255, 255, 0.018);
      --control-bg-hover: rgba(255, 255, 255, 0.075);
      --control-bg-active: rgba(255, 255, 255, 0.175);
      --hairline: rgba(255, 255, 255, 0.34);
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.16);
      --control-height: 52px;
      --control-font-size: 16px;
      --auto-panel-width: 394px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background:
        linear-gradient(90deg, rgba(68, 45, 45, 0.92) 0%, rgba(43, 37, 41, 0.96) 42%, #202028 100%),
        linear-gradient(180deg, #3b2d2d 0%, #222229 100%);
      color: var(--text);
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -12%;
      pointer-events: none;
    }
    body::before {
      background:
        linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 66px 66px;
      opacity: 0.38;
      transform: rotate(-13deg) scale(1.35);
      transform-origin: center;
    }
    body::after {
      background:
        linear-gradient(118deg, rgba(255, 255, 255, 0.08), transparent 24%, rgba(0, 0, 0, 0.18) 58%, transparent 88%),
        repeating-linear-gradient(152deg, transparent 0 118px, rgba(255, 255, 255, 0.035) 119px, transparent 120px),
        radial-gradient(circle at 50% 52%, transparent 0 30%, rgba(0, 0, 0, 0.34) 78%);
      opacity: 0.74;
    }
    body.missing-entry {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.92);
    }
    .shell {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0 42px;
      position: relative;
      z-index: 1;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 16px;
    }
    .brand-block {
      display: none;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0;
    }
    h3 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: 0;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--control-bg);
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .status {
      min-width: min(420px, 100%);
      max-width: 560px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--control-bg);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .status.ok {
      color: var(--brand-strong);
      border-color: var(--line);
    }
    .status.error {
      color: var(--red);
      border-color: rgba(255, 209, 209, 0.45);
    }
    .save-notice {
      position: fixed;
      left: 50%;
      bottom: 34px;
      z-index: 30;
      min-width: 92px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 0;
      background:
        linear-gradient(90deg, rgba(62, 51, 53, 0.88), rgba(35, 35, 42, 0.9)),
        linear-gradient(rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015));
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      color: #fff;
      font-size: 14px;
      font-weight: 620;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 180ms ease, transform 220ms ease;
    }
    .save-notice.active {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .subscription-panel {
      --sub-button-width: 144px;
      --sub-button-gap: 8px;
      --sub-action-width: calc(var(--sub-button-width) * 2 + var(--sub-button-gap));
    }
    .subscription-title-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) var(--sub-action-width);
      gap: var(--sub-button-gap);
      align-items: center;
      padding: 0 8px;
      margin-bottom: 14px;
    }
    .subscription-title-row h2 {
      margin: 0;
    }
    .subscription-status {
      width: var(--sub-action-width);
      min-width: 0;
      max-width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .header-tools {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      width: min(780px, 100%);
      min-width: 0;
    }
    .header-tools .status {
      flex: 1 1 360px;
    }
    #logoutButton {
      width: 96px;
      min-width: 96px;
      height: 44px;
      min-height: 44px;
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 16px;
      margin-bottom: 14px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .tab {
      width: auto;
      min-width: 92px;
      border-color: var(--line);
      background: var(--control-bg);
      color: var(--text);
    }
    .tab.active {
      border-color: var(--line-strong);
      background: var(--control-bg-active);
      color: #fff;
    }
    .view {
      display: none;
    }
    .view.active {
      display: block;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 0.92fr) minmax(420px, 1.45fr);
      gap: 14px;
      align-items: start;
    }
    .config-layout {
      grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr);
      align-items: stretch;
    }
    .basic-config-panel[hidden] {
      display: none;
    }
    .subscription-layout {
      align-items: stretch;
    }
    .proxy-panel {
      box-sizing: border-box;
      display: grid;
      gap: 14px;
      width: 100%;
      margin-right: 0;
    }
    .proxy-editors {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }
    .proxy-editor-card {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      align-content: start;
    }
    .proxy-editor-title,
    .proxy-mode-inline {
      font-size: 18px;
      font-weight: 700;
    }
    .proxy-textarea-wrap {
      position: relative;
      min-height: 220px;
    }
    .proxy-editor-card textarea {
      height: clamp(220px, 34vh, 340px);
      min-height: 220px;
      white-space: pre;
    }
    .proxy-exit-card.auto-mode textarea {
      color: transparent;
      caret-color: transparent;
      resize: none;
    }
    .proxy-auto-hint {
      position: absolute;
      inset: 1px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.76);
      font-size: 20px;
      font-weight: 760;
      letter-spacing: 0.04em;
      background:
        radial-gradient(circle at 50% 42%, rgba(98, 169, 255, 0.14), transparent 34%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.035), rgba(0, 0, 0, 0.05));
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.36);
    }
    .proxy-auto-hint[hidden] {
      display: none;
    }
    .proxy-editor-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
      margin-top: 2px;
    }
    .proxy-editor-actions :is(button, select) {
      width: 100%;
      height: var(--control-height);
      min-height: var(--control-height);
      justify-self: stretch;
    }
    .proxy-mode-inline {
      min-width: 0;
      display: block;
    }
    #proxyMode {
      color-scheme: dark;
      border-color: var(--line);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.035)),
        var(--control-bg);
      color: var(--text);
      font-weight: 700;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(2px) saturate(1.06);
      -webkit-backdrop-filter: blur(2px) saturate(1.06);
      padding: 20px;
      margin-bottom: 14px;
    }
    .panel.flat {
      box-shadow: none;
    }
    .globe-card {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      overflow: visible;
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
      margin: 0;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .globe-card::before,
    .globe-card::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 999px;
    }
    .globe-card::before {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(111, 183, 255, 0.18), transparent 66%);
      filter: blur(18px);
      opacity: 0.65;
    }
    .globe-card::after {
      display: none;
    }
    .globe-stage {
      position: relative;
      width: min(280px, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      isolation: isolate;
    }
    .mini-globe {
      position: relative;
      width: 78%;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(circle at 38% 28%, rgba(255, 255, 255, 0.22), transparent 28%),
        radial-gradient(circle at 62% 72%, rgba(73, 147, 255, 0.1), transparent 42%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(8, 12, 24, 0.18));
      border: 1px solid rgba(255, 255, 255, 0.48);
      box-shadow:
        inset -28px -24px 60px rgba(0, 0, 0, 0.28),
        inset 16px 14px 28px rgba(255, 255, 255, 0.08),
        0 0 42px rgba(98, 169, 255, 0.16);
      animation: globeFloat 5.4s ease-in-out infinite;
      z-index: 2;
    }
    .mini-globe::after {
      content: "";
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      border-left: 1px solid rgba(255, 255, 255, 0.36);
      filter: blur(0.2px);
      opacity: 0.8;
      pointer-events: none;
    }
    .globe-svg {
      position: absolute;
      inset: -3%;
      width: 106%;
      height: 106%;
      opacity: 0.9;
      animation: globeDrift 8s ease-in-out infinite alternate;
    }
    .globe-orbit {
      --orbit-x: 66deg;
      --orbit-z: -28deg;
      position: absolute;
      inset: 11%;
      border: 1px solid rgba(116, 190, 255, 0.5);
      border-radius: 50%;
      transform: rotateX(var(--orbit-x)) rotateZ(var(--orbit-z));
      box-shadow: 0 0 16px rgba(102, 179, 255, 0.18);
      z-index: 3;
      animation: orbitSweep 7s linear infinite;
    }
    .globe-orbit.orbit-two {
      --orbit-x: 70deg;
      --orbit-z: 35deg;
      inset: 17%;
      border-color: rgba(215, 231, 255, 0.42);
      animation-duration: 9s;
      animation-direction: reverse;
    }
    .orbit-dot {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #7fc5ff;
      box-shadow: 0 0 14px rgba(127, 197, 255, 0.9);
      transform: translate(-50%, -50%);
    }
    .globe-orbit .orbit-dot {
      left: 10%;
      top: 48%;
    }
    .orbit-two .orbit-dot {
      left: 82%;
      top: 54%;
    }
    @keyframes globeFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
    @keyframes globeDrift {
      from {
        transform: translateX(-7px) rotate(-1deg);
      }
      to {
        transform: translateX(7px) rotate(1deg);
      }
    }
    @keyframes orbitSweep {
      to {
        transform: rotateX(var(--orbit-x)) rotateZ(calc(var(--orbit-z) + 360deg));
      }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--text);
      font-size: 13px;
      font-weight: 520;
    }
    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      font-size: 14px;
      font-weight: 520;
    }
    .check input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: rgba(255, 255, 255, 0.86);
    }
    input,
    select,
    button {
      width: min(360px, 100%);
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--control-bg);
      color: var(--text);
      font: inherit;
      letter-spacing: 0;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.055),
        0 16px 34px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(2px) saturate(1.06);
      -webkit-backdrop-filter: blur(2px) saturate(1.06);
      transition:
        background-color 0.2s ease-in-out,
        border-color 0.2s ease-in-out,
        box-shadow 0.2s ease-in-out,
        color 0.2s ease-in-out,
        transform 0.2s ease-in-out;
    }
    input,
    select {
      min-height: 58px;
      padding: 0 18px;
      text-align: center;
      justify-self: center;
      font-weight: 400;
    }
    textarea {
      width: 100%;
      min-height: 152px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--control-bg);
      color: var(--text);
      font: inherit;
      font-weight: 400;
      letter-spacing: 0;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.055),
        0 16px 34px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(2px) saturate(1.06);
      -webkit-backdrop-filter: blur(2px) saturate(1.06);
      transition:
        background-color 0.2s ease-in-out,
        border-color 0.2s ease-in-out,
        box-shadow 0.2s ease-in-out,
        color 0.2s ease-in-out,
        transform 0.2s ease-in-out;
      resize: vertical;
      line-height: 1.45;
    }
    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
      opacity: 1;
    }
    input:hover,
    select:hover,
    textarea:hover,
    button:hover {
      border-color: var(--line-strong);
      background-color: var(--control-bg-hover);
      transform: translateY(-1px);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.16),
        0 18px 42px rgba(0, 0, 0, 0.18);
    }
    input:focus,
    select:focus,
    textarea:focus {
      outline: 0;
      border-color: var(--line-strong);
      background-color: var(--control-bg-active);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.24),
        0 0 0 3px rgba(255, 255, 255, 0.1),
        0 18px 42px rgba(0, 0, 0, 0.18);
    }
    select option {
      color: #f7f7f7;
      background: #2d282c;
    }
    button {
      height: var(--control-height);
      min-height: var(--control-height);
      padding: 0 14px;
      border-color: var(--line);
      background: var(--control-bg);
      color: var(--text);
      font-size: var(--control-font-size);
      line-height: 1.2;
      font-weight: 520;
      text-transform: none;
      cursor: pointer;
      justify-self: center;
    }
    button:active {
      background-color: var(--control-bg-active);
      transform: translateY(0);
    }
    button.secondary,
    button.ghost,
    button.warn {
      border-color: var(--line);
      background: var(--control-bg);
      color: var(--text);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
    }
    .actions button {
      width: min(360px, 100%);
      min-width: 0;
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      overflow-wrap: anywhere;
    }
    input.mono,
    textarea.mono,
    select.mono,
    button.mono {
      font-family: inherit;
    }
    .link-list {
      display: grid;
      gap: 8px;
    }
    .link-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) repeat(2, var(--sub-button-width));
      gap: var(--sub-button-gap);
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel-soft);
    }
    .link-row button {
      min-width: 0;
      width: 100%;
      height: var(--control-height);
      min-height: var(--control-height);
      padding: 0 10px;
    }
    .compact-sub-panel {
      align-self: stretch;
      display: grid;
      place-items: center;
    }
    .sub-name-area {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 14px;
      width: 100%;
    }
    .sub-name-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px;
      gap: 8px;
      align-items: center;
      width: min(320px, 100%);
    }
    .sub-name-input {
      width: 100%;
      min-height: 46px;
      margin: 0;
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.055);
      box-shadow: none;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 740;
      color: var(--text);
      text-align: center;
    }
    .sub-name-input:hover,
    .sub-name-input:focus {
      border: 1px solid var(--line);
      background: var(--control-bg);
      transform: translateY(-1px);
    }
    .sub-save-name {
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 1px 6px;
    }
    .qr-box {
      display: grid;
      place-items: center;
      width: min(320px, 100%);
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }
    .qr-box #qrCanvas {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }
    .qr-box canvas,
    .qr-box img {
      width: 100%;
      height: 100%;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel-soft);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 880px;
    }
    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }
    th {
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
      font-weight: 740;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .preference-workspace {
      min-height: 520px;
    }
    .ok {
      color: var(--brand-strong);
      font-weight: 740;
    }
    .bad {
      color: var(--red);
      font-weight: 740;
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    #autoView .split {
      width: 100%;
      max-width: none;
      grid-template-columns: minmax(0, var(--auto-panel-width)) minmax(360px, 1fr);
      align-items: start;
      gap: 20px;
    }
    .state-box {
      min-height: 126px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .auto-main-panel {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 14px;
      width: min(var(--auto-panel-width), 100%);
      max-width: var(--auto-panel-width);
    }
    .auto-status-layout {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .auto-status-layout h2,
    .auto-status-layout h3 {
      margin-bottom: 10px;
    }
    .auto-status-layout #currentProxyip {
      min-height: 88px;
    }
    .auto-visible-settings {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: end;
      margin-top: 0;
    }
    .auto-visible-settings label {
      min-width: 0;
    }
    .auto-visible-settings :is(select, button) {
      width: 100%;
      min-height: 58px;
      justify-self: stretch;
    }
    .auto-actions {
      display: none;
    }
    .auto-hidden-settings[hidden] {
      display: none;
    }
    .auto-country-panel {
      min-width: 0;
      display: grid;
      align-content: start;
      gap: 12px;
      padding-top: 0;
    }
    .auto-picker-row {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }
    .auto-region-button,
    .auto-ip-tab,
    .auto-country-button {
      min-width: 0;
      border-color: var(--line);
      background: var(--control-bg);
      color: var(--text);
      font-weight: 760;
    }
    .auto-region-button,
    .auto-ip-tab {
      min-height: 52px;
      padding: 0 10px;
      white-space: nowrap;
    }
    .auto-region-button.active,
    .auto-ip-tab.active,
    .auto-country-button.active {
      border-color: var(--line-strong);
      background: var(--control-bg-active);
      color: #fff;
    }
    .auto-country-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 2px;
    }
    .auto-country-button {
      min-height: 48px;
      padding: 6px 8px;
      line-height: 1.2;
      font-size: 14px;
    }
    .auto-country-hint {
      min-height: 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .auto-run-dialog[hidden] {
      display: none;
    }
    .auto-run-dialog {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .auto-run-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(11, 11, 16, 0.62);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .auto-run-panel {
      position: relative;
      z-index: 1;
      width: min(920px, calc(100vw - 32px));
      max-height: min(760px, calc(100vh - 48px));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background:
        linear-gradient(116deg, rgba(66, 49, 51, 0.96), rgba(31, 31, 39, 0.97)),
        var(--panel-soft);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }
    .auto-run-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }
    .auto-run-head h2 {
      margin-bottom: 6px;
      font-size: 20px;
    }
    .auto-run-subtitle,
    .auto-run-progress {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .auto-run-progress {
      min-height: 22px;
    }
    .auto-run-table-wrap {
      min-height: 260px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.025);
    }
    .auto-run-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .auto-run-table th,
    .auto-run-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      text-align: left;
      vertical-align: middle;
    }
    .auto-run-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(33, 31, 38, 0.96);
      color: rgba(255, 255, 255, 0.82);
      font-weight: 760;
    }
    .auto-run-table td:first-child,
    .auto-run-table th:first-child {
      width: 64px;
      text-align: center;
    }
    .auto-run-table input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #fff;
    }
    .auto-run-row-ok {
      color: #fff;
    }
    .auto-run-row-bad {
      color: rgba(255, 209, 209, 0.82);
    }
    .auto-run-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }
    .auto-run-actions button {
      width: 100%;
      min-height: 52px;
    }
    .direct-open {
      max-width: 760px;
      margin: 18vh auto 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .direct-missing {
      width: min(560px, calc(100vw - 48px));
      max-width: none;
      margin: 0;
      padding: 28px 0;
      position: relative;
      z-index: 1;
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.78);
      border-bottom: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
    }
    .direct-missing::before,
    .direct-missing::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 28px;
      pointer-events: none;
      opacity: 0.86;
      background:
        linear-gradient(rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.96)) left top / 64px 1px no-repeat,
        linear-gradient(rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.96)) right top / 64px 1px no-repeat,
        linear-gradient(rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.34)) left top / 1px 22px no-repeat,
        linear-gradient(rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.34)) right top / 1px 22px no-repeat;
    }
    .direct-missing::before {
      top: -1px;
    }
    .direct-missing::after {
      bottom: -1px;
      transform: rotate(180deg);
    }
    .direct-missing h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 520;
      letter-spacing: 0;
      color: inherit;
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.36);
    }
    @media (max-width: 960px) {
      .shell {
        width: min(100% - 20px, 760px);
        padding-top: 14px;
      }
      header,
      .layout,
      .split,
      .sub-name-area,
      .proxy-controls,
      .proxy-editors {
        grid-template-columns: 1fr;
      }
      header {
        display: grid;
      }
      .proxy-panel {
        width: 100%;
      }
      .globe-card {
        min-height: 260px;
      }
      .globe-stage {
        width: min(230px, 100%);
      }
      .grid,
      .grid.three {
        grid-template-columns: 1fr;
      }
      .link-row {
        grid-template-columns: minmax(90px, 1fr) repeat(2, var(--sub-button-width));
      }
      .link-row button {
        width: 100%;
      }
      .actions button {
        width: 100%;
      }
      .header-tools {
        justify-content: stretch;
        min-width: 0;
      }
      #logoutButton {
        width: 96px;
      }
      #autoView .split {
        grid-template-columns: 1fr;
      }
      .auto-country-panel {
        width: min(var(--auto-panel-width), 100%);
        max-width: var(--auto-panel-width);
      }
      .auto-picker-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 430px) {
      .subscription-title-row,
      .link-row {
        grid-template-columns: 1fr;
      }
      .subscription-status {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="shell">
    <header>
      <div class="brand-block">
        <h1>IP168 控制台</h1>
        <div class="meta">
          <span id="originPill" class="pill mono">Worker</span>
          <span id="entryPill" class="pill mono">入口</span>
          <span id="converterPill" class="pill mono">转换器</span>
        </div>
      </div>
      <div class="header-tools">
        <button id="logoutButton" class="ghost" type="button">登出</button>
      </div>
    </header>

    <nav class="tabs" aria-label="控制台页面">
      <button class="tab active" type="button" data-view="configView">配置</button>
      <button class="tab" type="button" data-view="subView">订阅</button>
      <button class="tab" type="button" data-view="proxyView">优选</button>
      <button class="tab" type="button" data-view="autoView">自动</button>
    </nav>

    <section id="configView" class="view active">
      <div class="layout config-layout">
        <section class="panel basic-config-panel" hidden>
          <h2>基础配置</h2>
          <div class="grid">
            <label>Worker Host
              <input id="host" spellcheck="false" autocomplete="off">
            </label>
            <label>Fingerprint
              <select id="fingerprint">
                <option value="chrome">chrome</option>
                <option value="firefox">firefox</option>
                <option value="safari">safari</option>
                <option value="edge">edge</option>
                <option value="ios">ios</option>
                <option value="android">android</option>
                <option value="random">random</option>
              </select>
            </label>
          </div>
          <label style="margin-top:12px">UUID
            <input id="uuid" class="mono" spellcheck="false" autocomplete="off">
          </label>
          <div class="grid" style="margin-top:12px">
            <label>订阅 token
              <input id="token" class="mono" spellcheck="false" autocomplete="off">
            </label>
          </div>
          <div class="actions">
            <button id="saveConfig" type="button">保存配置</button>
            <button id="reloadState" class="secondary" type="button">重新读取</button>
          </div>
        </section>

        <section class="panel proxy-panel">
          <div class="proxy-editors">
            <section class="proxy-editor-card proxy-entry-card">
              <label class="proxy-editor-title" for="addText">入口IP</label>
              <textarea id="addText" class="mono" spellcheck="false"></textarea>
              <div class="proxy-editor-actions">
                <button id="saveEntry" type="button">保存入口</button>
                <button id="refreshEntries" class="ghost" type="button">刷新入口</button>
              </div>
            </section>
            <section class="proxy-editor-card proxy-exit-card">
              <label class="proxy-editor-title" for="proxyip">出口IP</label>
              <div class="proxy-textarea-wrap">
                <textarea id="proxyip" class="mono" spellcheck="false"></textarea>
                <div id="proxyAutoHint" class="proxy-auto-hint" hidden>自动模式</div>
              </div>
              <div class="proxy-editor-actions">
                <button id="saveProxyip" type="button">保存出口</button>
                <div class="proxy-mode-inline">
                  <select id="proxyMode" aria-label="模式">
                    <option value="auto">自动</option>
                    <option value="manual">手动</option>
                  </select>
                </div>
                <input id="proxyCount" readonly hidden>
              </div>
            </section>
          </div>
        </section>
        <aside class="globe-card" aria-hidden="true">
          <div class="globe-stage">
            <div class="globe-orbit"><span class="orbit-dot"></span></div>
            <div class="globe-orbit orbit-two"><span class="orbit-dot"></span></div>
            <div class="mini-globe">
              <svg class="globe-svg" viewBox="0 0 320 320" role="presentation" focusable="false">
                <defs>
                  <clipPath id="globeClip">
                    <circle cx="160" cy="160" r="147"></circle>
                  </clipPath>
                  <pattern id="landDots" width="7" height="7" patternUnits="userSpaceOnUse">
                    <circle cx="3.5" cy="3.5" r="1.45" fill="#f6faff" opacity="0.84"></circle>
                  </pattern>

    function setStatus(text, type) {
      statusEl.textContent = text || "";
      statusEl.className = "status subscription-status" + (type ? " " + type : "");
    }

    function showSaveNotice(text = "已保存") {
      if (saveNoticeActive) return;
      saveNoticeActive = true;
      saveNoticeEl.textContent = text;
      saveNoticeEl.classList.add("active");
      window.clearTimeout(saveNoticeTimer);
      saveNoticeTimer = window.setTimeout(() => {
        saveNoticeEl.classList.remove("active");
        saveNoticeActive = false;
      }, 1600);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value || {}));
    }

    function cleanProxyipText(text) {
      return String(text || "")
        .split(/[\r\n,;]+/)
        .map((item) => item.split("#")[0].trim())
        .filter(Boolean)
        .join(",");
    }

    function countList(text) {
      return cleanProxyipText(text).split(",").filter(Boolean).length;
    }

    function displayProxyipText(text) {
      return cleanProxyipText(text).split(",").filter(Boolean).join("\n");
    }

    function currentSavedProxyipText() {
      return displayProxyipText(state.config?.[PROXY_KEY]?.PROXYIP || "");
    }

    function currentAutoProxyipText(autoState) {
      const source = autoState || state.auto?.state || {};
      const current = cleanProxyipText(source.currentProxyip || "");
      if (current) return current;
      if (Array.isArray(source.selectedProxyip)) {
        return cleanProxyipText(source.selectedProxyip.join(","));
      }
      return "";
    }

    function syncProxyModeView() {
      const isAuto = fields.proxyMode.value === "auto";
      if (isAuto && !fields.proxyip.readOnly) {
        proxyipManualDraft = fields.proxyip.value;
      }
      fields.proxyip.readOnly = isAuto;
      fields.proxyip.setAttribute("aria-readonly", isAuto ? "true" : "false");
      fields.proxyExitCard?.classList.toggle("auto-mode", isAuto);
      fields.proxyAutoHint.hidden = !isAuto;
      if (isAuto) {
        fields.proxyip.value = "";
      } else if (!fields.proxyip.value.trim()) {
        fields.proxyip.value = proxyipManualDraft || currentSavedProxyipText();
      }
      fields.proxyCount.value = countList(fields.proxyip.value || currentSavedProxyipText());
    }

    function endpointOf(node) {
      return node?.proxy || (node?.ip && node?.port ? node.ip + ":" + node.port : "");
    }

    function normalizedNumber(input, fallback, min, max) {
      const value = Number(input.value);
      if (!Number.isFinite(value)) return fallback;
      return Math.max(min, Math.min(max, Math.round(value)));
    }

    async function readJson(response) {
      const text = await response.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        throw new Error(response.redirected ? "登录状态失效，请重新进入后台" : "响应不是 JSON");
      }
      if (!response.ok) {
        const error = new Error(data.error || data.message || ("HTTP " + response.status));
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function isAuthError(error) {
      const status = Number(error?.status || 0);
      return status === 401 || status === 403 || /forbidden|unauthorized|登录状态失效/i.test(String(error?.message || ""));
    }

    async function api(url, options) {
      const response = await fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
        ...options
      });
      return readJson(response);
    }

    async function catalogJson(url, signal) {
      const response = await fetch(url, { cache: "no-store", signal });
      return readJson(response);
    }

    async function postJson(url, body, signal) {
      return api(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal
      });
    }

    function fillForm(config, addText) {
      const proxy = config[PROXY_KEY] || {};
      const sub = config[SUB_KEY] || {};
      fields.host.value = config.HOST || "";
      fields.uuid.value = config.UUID || "";
      fields.token.value = sub.TOKEN || "";
      fields.subName.value = sub.SUBNAME || DEFAULT_SUB_NAME;
      fields.fingerprint.value = config.Fingerprint || "chrome";
      fields.addText.value = addText || "";
      fields.proxyMode.value = fields.autoEnabled?.checked ? "auto" : "manual";
      proxyipManualDraft = displayProxyipText(proxy.PROXYIP || "");
      fields.proxyip.value = proxyipManualDraft;
      fields.proxyCount.value = countList(proxy.PROXYIP || "");
      renderLinks();
    }

    function readConfigFromForm() {
      const config = clone(state.config);
      const proxy = { ...(config[PROXY_KEY] || {}) };
      const sub = { ...(config[SUB_KEY] || {}) };
      const isAutoMode = fields.proxyMode.value === "auto";
      config.HOST = fields.host.value.trim();
      config.HOSTS = config.HOST ? [config.HOST] : [];
      config.UUID = fields.uuid.value.trim();
      config.Fingerprint = fields.fingerprint.value;
      proxy.Mode = isAutoMode ? "proxy-first-fallback-direct" : "proxy-only";
      if (!isAutoMode) {
        proxy.PROXYIP = cleanProxyipText(fields.proxyip.value);
        fields.proxyip.value = displayProxyipText(proxy.PROXYIP);
      } else {
        fields.proxyip.value = displayProxyipText(proxy.PROXYIP || "");
      }
      fields.proxyCount.value = countList(proxy.PROXYIP);
      sub.TOKEN = fields.token.value.trim();
      sub.SUBNAME = fields.subName.value.trim() || DEFAULT_SUB_NAME;
      config[PROXY_KEY] = proxy;
      config[SUB_KEY] = sub;
      return config;
    }

    function makeSubLink(flag) {
      const token = fields.token.value.trim();
      if (!token) return "";
      const url = new URL(bootstrap.subPath, bootstrap.workerOrigin);
      url.searchParams.set("token", token);
      url.searchParams.set("v", "2026-06-13-v6");
      if (flag) {
        url.searchParams.set(flag, "1");
      }
      url.hash = fields.subName.value.trim() || DEFAULT_SUB_NAME;
      return url.href;
    }

    function renderLinks() {
      state.links = {
        Mixed: makeSubLink(""),
        Base64: makeSubLink("b64"),
        Clash: makeSubLink("clash"),
        "Sing-box": makeSubLink("sb")
      };
      const links = document.getElementById("links");
      links.innerHTML = Object.entries(state.links).map(([name, value]) => `
        <div class="link-row" data-value="${escapeHtml(value)}">
          <strong>${escapeHtml(name)}</strong>
          <button class="secondary" type="button" data-copy="${escapeHtml(name)}" ${value ? "" : "disabled"}>复制</button>
          <button class="ghost" type="button" data-qr="${escapeHtml(name)}" ${value ? "" : "disabled"}>&#20108;&#32500;&#30721;</button>
        </div>
      `).join("");
      links.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", () => copyText(state.links[button.dataset.copy], button.dataset.copy));
      });
      links.querySelectorAll("[data-qr]").forEach((button) => {
        button.addEventListener("click", () => renderQr(state.links[button.dataset.qr], button.dataset.qr));
      });
      if (!state.qrUrl && state.links.Mixed) {
        renderQr(state.links.Mixed, "Mixed");
      }
    }

    function renderQr(value, label) {
      state.qrUrl = value || "";
      const qrBox = document.getElementById("qrCanvas");
      qrBox.innerHTML = "";
      if (!state.qrUrl) {
        setStatus("\u6ca1\u6709\u53ef\u751f\u6210\u4e8c\u7ef4\u7801\u7684\u8ba2\u9605\u94fe\u63a5\u3002", "error");
        return;
      }
      if (!window.QRCode) {
        setStatus("\u4e8c\u7ef4\u7801\u5e93\u672a\u52a0\u8f7d\uff0c\u94fe\u63a5\u4ecd\u53ef\u590d\u5236\u3002", "error");
        return;
      }
      try {
        new window.QRCode(qrBox, {
          text: state.qrUrl,
          width: 320,
          height: 320,
          correctLevel: window.QRCode.CorrectLevel.M
        });
        setStatus(label + " \u4e8c\u7ef4\u7801", "ok");
      } catch {
        setStatus("\u4e8c\u7ef4\u7801\u751f\u6210\u5931\u8d25\u3002", "error");
      }
    }

    function copyTextWithSelection(value) {
      const textarea = document.createElement("textarea");
      textarea.value = value;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch {
        copied = false;
      }
      textarea.remove();
      return copied;
    }

    function writeClipboardText(value) {
      if (!navigator.clipboard?.writeText) {
        return Promise.reject(new Error("Clipboard API unavailable"));
      }
      return Promise.race([
        navigator.clipboard.writeText(value),
        new Promise((_, reject) => window.setTimeout(() => reject(new Error("Clipboard write timeout")), 600))
      ]);
    }

    async function copyText(value, label) {
      if (!value) return;
      const copiedLabel = label || "链接";
      setStatus("已复制 " + copiedLabel, "ok");
      if (copyTextWithSelection(value)) {
        return;
      }
      try {
        await writeClipboardText(value);
      } catch {
      }
    }

    async function loadState() {
      const data = await api(bootstrap.endpoints.state);
      state.config = data.config || {};
      state.addText = data.addText || "";
      state.auto = data.proxyAuto || { settings: {}, state: {} };
      state.currentProxyip = currentAutoProxyipText(state.auto.state) || data.currentProxyip || state.config?.[PROXY_KEY]?.PROXYIP || "";
      fillForm(state.config, state.addText);
      fillAutoForm(state.auto.settings || {});
      renderAutoState(state.auto.state || {}, state.currentProxyip);
    }

      setStatus("正在保存配置...");
      const config = readConfigFromForm();
      const autoSettings = readAutoSettings();
      const [data, autoData] = await Promise.all([
        postJson(bootstrap.endpoints.save, {
          config,
          addText: fields.addText.value
        }),
        postJson(bootstrap.endpoints.proxyAuto, autoSettings)
      ]);
      state.config = data.config || config;
      state.addText = data.addText || fields.addText.value;
      state.currentProxyip = state.config?.[PROXY_KEY]?.PROXYIP || state.currentProxyip || "";
      state.auto = {
        settings: autoData.settings || autoSettings,
        state: autoData.state || state.auto?.state || {}
      };
      state.currentProxyip = currentAutoProxyipText(state.auto.state) || state.config?.[PROXY_KEY]?.PROXYIP || state.currentProxyip || "";
      fillForm(state.config, state.addText);
      fillAutoForm(state.auto.settings);
      renderAutoState(state.auto.state, state.currentProxyip);
      setStatus("配置已保存。", "ok");
    }

    async function saveEntry() {
      setStatus("正在保存入口...");
      const config = clone(state.config);
      const data = await postJson(bootstrap.endpoints.save, {
        config,
        addText: fields.addText.value
      });

    function readProxyConfigFromForm() {
      const config = clone(state.config);
      const proxy = { ...(config[PROXY_KEY] || {}) };
      const isAutoMode = fields.proxyMode.value === "auto";
      proxy.Mode = isAutoMode ? "proxy-first-fallback-direct" : "proxy-only";
      if (!isAutoMode) {
        proxy.PROXYIP = cleanProxyipText(fields.proxyip.value);
        proxyipManualDraft = displayProxyipText(proxy.PROXYIP);
        fields.proxyip.value = proxyipManualDraft;

    async function saveProxyip() {
      setStatus("正在保存出口...");
      fields.autoEnabled.checked = fields.proxyMode.value === "auto";
      const config = readProxyConfigFromForm();

        postJson(bootstrap.endpoints.save, {
          config,
          addText: state.addText || ""
        }),
        postJson(bootstrap.endpoints.proxyAuto, autoSettings)
      ]);
      state.config = data.config || config;
      state.addText = data.addText ?? state.addText ?? "";
      state.currentProxyip = state.config?.[PROXY_KEY]?.PROXYIP || state.currentProxyip || "";
      state.auto = {
        settings: autoData.settings || autoSettings,
        state: autoData.state || state.auto?.state || {}
      };
      state.currentProxyip = currentAutoProxyipText(state.auto.state) || state.config?.[PROXY_KEY]?.PROXYIP || state.currentProxyip || "";

      fillAutoForm(state.auto.settings);

    function probeFailureText(result) {
      const text = String(result?.error || result?.traceError || result?.googleError || "失败").trim();
      return text.length > 42 ? text.slice(0, 42) + "..." : text;
    }

    function catalogCountryList(summary, version) {
      const type = String(version).toLowerCase() === "all" ? "all" : (String(version) === "6" ? "ipv6" : "ipv4");
      if (Array.isArray(summary?.countries)) {
        return summary.countries;
      }
      if (Array.isArray(summary?.files?.[type]?.topCountries)) {
        return summary.files[type].topCountries;
      }
      const countryMap = summary?.countries?.[type];
      if (countryMap && typeof countryMap === "object") {
        return Object.entries(countryMap).map(([code, count]) => ({ code, count }));
      }
      return [];
    }

    function catalogPortList(summary, version) {
      if (Array.isArray(summary?.ports)) {
        return summary.ports;
      }
      const type = String(version) === "6" ? "ipv6" : "ipv4";
      const count = Number(summary?.files?.[type]?.total || 0);
      return [{ port: String(summary?.port || "443"), count }];
    }

    async function loadSummary() {
      try {
        state.catalogSummary = bootstrap.catalog?.summaryUrl ? await catalogJson(bootstrap.catalog.summaryUrl) : {};
      } catch (error) {
        state.catalogSummary = {};
        setStatus(error.message || "\u7f3a\u5c11 IP \u4ed3\u5e93\u914d\u7f6e", "error");
      }
      fillAutoCountryOptions(catalogCountryList(state.catalogSummary, "all"));
      fillAutoPortOptions(catalogPortList(state.catalogSummary, state.autoIpVersion));
      renderAutoPicker();
    }

    function topCatalogPorts(ports) {
      return (Array.isArray(ports) ? ports : [])
        .map((item) => ({
          port: String(item.port || "").trim(),
          count: Number(item.count) || 0
        }))
        .filter((item) => item.port)
        .sort((left, right) => (Number(right.count) || 0) - (Number(left.count) || 0))
        .slice(0, 3);
    }

    function autoCountryLabel(code) {
      const normalized = String(code || "").trim().toUpperCase();
      return AUTO_COUNTRY_LABELS[normalized] || normalized;
    }

    function normalizedCatalogCountries(countries) {
      return (Array.isArray(countries) ? countries : [])
        .map((item) => ({
          code: String(item.code || "").trim().toUpperCase(),
          count: Number(item.count) || 0
        }))
        .filter((item) => item.code);
    }

    function autoCountryMap(version = "all") {
      const map = new Map();
      normalizedCatalogCountries(catalogCountryList(state.catalogSummary || {}, version)).forEach((item) => {
        map.set(item.code, item.count);
      });
      return map;
    }

    function autoCountriesForRegion(region = state.autoRegion) {
      const counts = autoCountryMap("all");
      return (AUTO_REGION_COUNTRIES[region] || [])
        .map((code) => ({ code, count: counts.get(code) || 0 }))
        .filter((item) => item.count > 0)
        .sort((left, right) => (Number(right.count) || 0) - (Number(left.count) || 0));
    }

    function renderAutoRegionButtons() {
      document.querySelectorAll(".auto-region-button").forEach((button) => {
        const region = button.dataset.autoRegion || "";
        const count = autoCountriesForRegion(region).length;
        button.classList.toggle("active", region === state.autoRegion);
        button.textContent = count ? region + " " + count : region;
      });
    }

    function renderAutoIpButtons() {
      document.querySelectorAll(".auto-ip-tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.autoIpVersion === state.autoIpVersion);
      });
    }

    function renderAutoCountryButtons() {
      const countries = autoCountriesForRegion(state.autoRegion);
      if (!fields.autoCountryButtons) return;
      fields.autoCountryButtons.innerHTML = countries.map((item) => {
        const active = item.code === state.autoSelectedCountry ? " active" : "";
        const label = autoCountryLabel(item.code) + "\n" + item.count;
        return '<button class="auto-country-button' + active + '" type="button" data-auto-country="' + escapeHtml(item.code) + '">' + escapeHtml(label) + '</button>';
      }).join("");
      if (fields.autoCountryHint) {
        fields.autoCountryHint.textContent = countries.length
          ? (state.autoSelectedCountry ? "\u5df2\u9009\u62e9\uff1a" + autoCountryLabel(state.autoSelectedCountry) + "\uff0c\u70b9\u51fb\u7acb\u5373\u8fd0\u884c\u3002" : "\u8bf7\u9009\u62e9\u56fd\u5bb6\u540e\u70b9\u51fb\u7acb\u5373\u8fd0\u884c\u3002")
          : "\u5f53\u524d IP \u7248\u672c\u4e0b\u8fd9\u4e2a\u6d32\u6ca1\u6709\u53ef\u7528\u56fd\u5bb6\u3002";
      }
    }

    function renderAutoPicker() {
      renderAutoIpButtons();
      renderAutoRegionButtons();
      renderAutoCountryButtons();
    }

    function setAutoRegion(region) {
      if (!AUTO_REGION_ORDER.includes(region)) return;
      state.autoRegion = region;
      selectAutoCountry("");
      renderAutoPicker();
    }

    function setAutoIpVersion(version) {
      state.autoIpVersion = String(version) === "6" ? "6" : "4";
      selectAutoCountry("");
      fillAutoCountryOptions(catalogCountryList(state.catalogSummary || {}, "all"));
      fillAutoPortOptions(catalogPortList(state.catalogSummary || {}, state.autoIpVersion));
      renderAutoPicker();
    }

    function selectAutoCountry(country) {
      const value = String(country || "").trim().toUpperCase();
      const available = new Set(autoCountriesForRegion(state.autoRegion).map((item) => item.code));
      state.autoSelectedCountry = value && available.has(value) ? value : "";
      fields.autoCountry.value = state.autoSelectedCountry;
      if (state.autoSelectedCountry) {
        fields.autoEnabled.checked = true;
        fields.proxyMode.value = "auto";
        syncProxyModeView();
      }
      renderAutoCountryButtons();
    }

    function requireAutoCountrySelection() {
      const country = fields.autoCountry.value.trim().toUpperCase();
      if (country) return true;
      setStatus("\u8bf7\u5148\u9009\u62e9\u56fd\u5bb6\uff0c\u518d\u8fd0\u884c\u81ea\u52a8\u7ef4\u62a4\u3002", "error");
      if (fields.autoCountryHint) fields.autoCountryHint.textContent = "\u672a\u9009\u62e9\u56fd\u5bb6\uff0c\u4e0d\u4f1a\u89e6\u53d1\u81ea\u52a8\u8fd0\u884c\u3002";
      return false;
    }

    function fillAutoCountryOptions(countries) {
      const items = normalizedCatalogCountries(countries)
        .sort((left, right) => (Number(right.count) || 0) - (Number(left.count) || 0));
      const options = [{ code: "", count: 0 }].concat(items);
      fields.autoCountry.innerHTML = options.map((item) => {
        const label = item.code ? autoCountryLabel(item.code) : "\u8bf7\u9009\u62e9\u56fd\u5bb6";
        return '<option value="' + escapeHtml(item.code) + '">' + escapeHtml(label) + '</option>';
      }).join("");
      fields.autoCountry.value = state.autoSelectedCountry;
    }

    function fillAutoPortOptions(ports) {
      const topPorts = topCatalogPorts(ports);
      const current = String(state.auto?.settings?.port || fields.autoPort.value || "").trim();
      const options = [{ port: "", label: "全部端口" }].concat(topPorts.length ? topPorts : [{ port: "443", count: 0 }]);
      fields.autoPort.innerHTML = options.map((item) => `<option value="${escapeHtml(item.port)}">${escapeHtml(item.label || item.port)}</option>`).join("");
      fields.autoPort.value = options.some((item) => item.port === current) ? current : "";
    }

    function catalogNodesUrl(version) {
      if (String(version) === "6" && bootstrap.catalog.ipv6Url) return bootstrap.catalog.ipv6Url;
      if (bootstrap.catalog.ipv4Url) return bootstrap.catalog.ipv4Url;
      return "";
    }

    function catalogStatusMatches(node, status) {
      const value = String(status || "verified,usable").trim().toLowerCase();
      if (!value || value === "all") return true;
      const allowed = new Set(value.split(",").map((item) => item.trim()).filter(Boolean));
      return allowed.has(String(node?.status || "").trim().toLowerCase());
    }

    function resetAutoRunState(settings) {
      const runId = Number(state.autoRun?.runId || 0) + 1;
      abortAutoRunRequests();
      state.autoRun = {
        candidates: [],
        selected: new Set(),
        results: new Map(),
        settings,
        testing: false,
        cancel: false,
        controllers: new Set(),
        tested: 0,
        ok: 0,
        runId
      };
    }

    function abortAutoRunRequests() {
      const controllers = state.autoRun?.controllers;
      if (!(controllers instanceof Set)) return;
      controllers.forEach((controller) => controller.abort());
      controllers.clear();
    }

    function stopAutoRunRequests() {
      state.autoRun.cancel = true;
      state.autoRun.testing = false;
      abortAutoRunRequests();
      state.autoRun.results.forEach((result, proxy) => {
        if (result?.testing) {
          state.autoRun.results.set(proxy, { ...result, testing: false, ok: false, error: "\u5df2\u505c\u6b62" });
        }
      });
    }

    function autoRunEndpointResult(proxy) {
      return state.autoRun.results.get(proxy);
    }

    function autoRunDelayText(result) {
      if (!result) return state.autoRun.testing ? "\u6392\u961f\u4e2d" : "\u672a\u6d4b\u901f";
      if (result.testing) return "\u6d4b\u901f\u4e2d";
      if (!result.ok) return probeFailureText(result);
      const value = result.googleMs ?? result.traceMs ?? result.connectMs ?? result.delayMs ?? result.latencyMs ?? result.latency;
      return Number.isFinite(Number(value)) ? Math.round(Number(value)) + "ms" : "\u53ef\u7528";
    }

    function autoRunLatency(result) {
      const value = result?.googleMs ?? result?.traceMs ?? result?.connectMs ?? result?.delayMs ?? result?.latencyMs ?? result?.latency;
      return Number.isFinite(Number(value)) ? Number(value) : Number.POSITIVE_INFINITY;
    }

    function autoRunCandidateProxies(candidates = state.autoRun.candidates || []) {
      return candidates.map(endpointOf).filter(Boolean);
    }

    function autoRunSortedCandidates(candidates) {
      const originalIndex = new Map(autoRunCandidateProxies(candidates).map((proxy, index) => [proxy, index]));
      const rank = (result) => {
        if (result?.ok) return 0;
        if (result && !result.testing) return 1;
        if (result?.testing) return 2;
        return 3;
      };
      return [...candidates].sort((left, right) => {
        const leftProxy = endpointOf(left);
        const rightProxy = endpointOf(right);
        const leftResult = autoRunEndpointResult(leftProxy);
        const rightResult = autoRunEndpointResult(rightProxy);
        const rankDiff = rank(leftResult) - rank(rightResult);
        if (rankDiff) return rankDiff;
        if (leftResult?.ok && rightResult?.ok) {
          const latencyDiff = autoRunLatency(leftResult) - autoRunLatency(rightResult);
          if (latencyDiff) return latencyDiff;
        }
        return (originalIndex.get(leftProxy) ?? 0) - (originalIndex.get(rightProxy) ?? 0);
      });
    }

    function updateAutoRunTotals() {
      const completed = autoRunCandidateProxies().map((proxy) => state.autoRun.results.get(proxy)).filter((item) => item && !item.testing);
      state.autoRun.tested = completed.length;
      state.autoRun.ok = completed.filter((item) => item.ok).length;
    }

    async function loadAutoRunCandidates(settings, signal) {
      const url = catalogNodesUrl(settings.ipVersion);
      if (!url) throw new Error("\u7f3a\u5c11 IP \u4ed3\u5e93\u5730\u5740");
      const data = await catalogJson(url, signal);
      const country = String(settings.country || "").trim().toUpperCase();
      const port = String(settings.port || "").trim();
      return (Array.isArray(data.nodes) ? data.nodes : []).filter((node) => {
        if (country && String(node.country || "").trim().toUpperCase() !== country) return false;
        if (port && String(node.port || "").trim() !== port) return false;
        return catalogStatusMatches(node, settings.status);
      }).slice(0, AUTO_RUN_CANDIDATE_LIMIT);
    }

    function renderAutoRunDialog() {
      const settings = state.autoRun.settings || readAutoSettings();
      const candidates = state.autoRun.candidates || [];
      const selectedCount = state.autoRun.selected.size;
      updateAutoRunTotals();
      fields.autoRunSubtitle.textContent = autoCountryLabel(settings.country) + " / IPv" + settings.ipVersion + " / " + (settings.port || "全部端口");
      fields.autoRunProgress.textContent = "\u5019\u9009 " + candidates.length + " \u6761\uff0c\u5df2\u6d4b\u901f " + state.autoRun.tested + " / " + candidates.length + "\uff0c\u53ef\u7528 " + state.autoRun.ok + "\uff0c\u5df2\u9009 " + selectedCount + " / " + AUTO_RUN_IMPORT_LIMIT + "\u3002";
      fields.autoRunImport.disabled = !(selectedCount || state.autoRun.ok);
      fields.autoRunImport.textContent = "\u5bfc\u5165\uff08\u5df2\u9009 " + selectedCount + " / \u6700\u591a " + AUTO_RUN_IMPORT_LIMIT + "\uff09";
      if (!candidates.length) {
        fields.autoRunRows.innerHTML = '<tr><td colspan="5" class="hint">\u5f53\u524d\u56fd\u5bb6\u6ca1\u6709\u53ef\u5bfc\u5165\u7684\u5019\u9009 IP\u3002</td></tr>';
        return;
      }
      fields.autoRunRows.innerHTML = autoRunSortedCandidates(candidates).map((node) => {
        const proxy = endpointOf(node);
        const result = autoRunEndpointResult(proxy);
        const checked = state.autoRun.selected.has(proxy) ? " checked" : "";
        const disabled = (!checked && selectedCount >= AUTO_RUN_IMPORT_LIMIT) ? " disabled" : "";
        const rowClass = result?.ok ? "auto-run-row-ok" : (result && !result.testing ? "auto-run-row-bad" : "");
        const exit = autoCountryLabel(node.loc || node.country || "");
        const region = [node.city, node.asn || node.org].filter(Boolean).join(" / ");
        return `
          <tr class="${rowClass}">
            <td><input type="checkbox" data-auto-run-pick="${escapeHtml(proxy)}"${checked}${disabled}></td>
            <td class="mono">${escapeHtml(proxy)}</td>
            <td>${escapeHtml(exit || "-")}</td>
            <td>${escapeHtml(region || "-")}</td>
            <td>${escapeHtml(autoRunDelayText(result))}</td>
          </tr>
        `;
      }).join("");
    }

    async function openAutoRunDialog() {
      if (state.autoRun.testing) {
        stopAutoRunRequests();
        renderAutoRunDialog();
        return;
      }
      const settings = readAutoSettings();
      resetAutoRunState(settings);
      const runId = state.autoRun.runId;
      state.autoRun.testing = true;
      fields.autoRunDialog.hidden = false;
      fields.autoRunProgress.textContent = "\u6b63\u5728\u8bfb\u53d6\u5019\u9009...";
      fields.autoRunRows.innerHTML = '<tr><td colspan="5" class="hint">\u5019\u9009\u8bfb\u53d6\u4e2d...</td></tr>';
      setStatus("\u6b63\u5728\u6253\u5f00\u5019\u9009 IP \u6d4b\u901f\u961f\u5217...");
      const controller = new AbortController();
      const controllers = state.autoRun.controllers;
      controllers.add(controller);
      let candidates;
      try {
        candidates = await loadAutoRunCandidates(settings, controller.signal);
      } catch (error) {
        if (controller.signal.aborted || state.autoRun.runId !== runId || state.autoRun.cancel) return;
        state.autoRun.testing = false;
        throw error;
      } finally {
        controllers.delete(controller);
      }
      if (state.autoRun.runId !== runId || state.autoRun.cancel) return;
      state.autoRun.candidates = candidates;
      renderAutoRunDialog();
      const targets = state.autoRun.candidates.map(endpointOf).filter(Boolean);
      if (!targets.length) {
        state.autoRun.testing = false;
        setStatus("\u5f53\u524d\u56fd\u5bb6\u6ca1\u6709\u5019\u9009 IP\u3002", "error");
        return;
      }
      queueAutoRunSpeedTests(targets, runId).catch(showError);
    }

    async function queueAutoRunSpeedTests(targets, runId) {
      if (state.autoRun.runId !== runId || state.autoRun.cancel) return;
      state.autoRun.testing = true;
      state.autoRun.cancel = false;
      renderAutoRunDialog();
      for (let index = 0; index < targets.length; index += AUTO_RUN_TEST_BATCH_SIZE) {
        if (state.autoRun.runId !== runId || state.autoRun.cancel) return;
        const chunk = targets.slice(index, index + AUTO_RUN_TEST_BATCH_SIZE);
        chunk.forEach((proxy) => state.autoRun.results.set(proxy, { proxy, testing: true, ok: false }));
        renderAutoRunDialog();
        const controller = new AbortController();
        const controllers = state.autoRun.controllers;
        controllers.add(controller);
        try {
          const data = await postJson(bootstrap.endpoints.proxyTest, {
            targets: chunk,
            timeoutMs: AUTO_RUN_TEST_TIMEOUT_MS,
            concurrency: AUTO_RUN_TEST_CONCURRENCY,
            googleAfterTrace: true
          }, controller.signal);
          if (state.autoRun.runId !== runId || state.autoRun.cancel) return;
          const results = new Map((Array.isArray(data.results) ? data.results : []).map((result) => [String(result.proxy || ""), result]));
          chunk.forEach((proxy) => {
            state.autoRun.results.set(proxy, results.get(proxy) || { proxy, ok: false, error: "\u65e0\u7ed3\u679c" });
          });
        } catch (error) {
          if (controller.signal.aborted || state.autoRun.runId !== runId || state.autoRun.cancel) return;
          if (isAuthError(error)) {
            stopAutoRunRequests();
            fields.autoRunProgress.textContent = "登录状态失效，请重新进入后台";
            throw new Error("登录状态失效，请重新进入后台");
          }
          chunk.forEach((proxy) => {
            state.autoRun.results.set(proxy, {
              proxy,
              ok: false,
              error: error.message || String(error)
            });
          });
        } finally {
          controllers.delete(controller);
        }
        renderAutoRunDialog();
      }
      if (state.autoRun.runId !== runId || state.autoRun.cancel) return;
      state.autoRun.testing = false;
      renderAutoRunDialog();
    }

    function toggleAutoRunPick(proxy, checked) {
      if (!proxy) return;
      if (checked) {
        if (state.autoRun.selected.size >= AUTO_RUN_IMPORT_LIMIT) {
          renderAutoRunDialog();
          return;
        }
        state.autoRun.selected.add(proxy);
      } else {
        state.autoRun.selected.delete(proxy);
      }
      renderAutoRunDialog();
    }

    function selectedAutoRunEndpoints() {
      return autoRunSortedCandidates(state.autoRun.candidates)
        .map(endpointOf)
        .filter((proxy) => proxy && state.autoRun.selected.has(proxy))
        .slice(0, AUTO_RUN_IMPORT_LIMIT);
    }

    function autoRunFillToNine() {
      const selected = selectedAutoRunEndpoints();
      const used = new Set(selected);
      for (const node of autoRunSortedCandidates(state.autoRun.candidates)) {
        if (selected.length >= AUTO_RUN_IMPORT_LIMIT) break;
        const proxy = endpointOf(node);
        const result = autoRunEndpointResult(proxy);
        if (selected.length < AUTO_RUN_IMPORT_LIMIT && proxy && !used.has(proxy) && result?.ok) {
          selected.push(proxy);
          used.add(proxy);
        }
      }
      return selected;
    }

    async function autoRunImportSelected() {
      const finalProxyip = autoRunFillToNine();
      if (!finalProxyip.length) {
        fields.autoRunProgress.textContent = "\u6682\u65e0\u53ef\u5bfc\u5165 IP\uff0c\u8bf7\u7b49\u5f85\u6d4b\u901f\u7ed3\u679c\u3002";
        return;
      }
      fields.proxyMode.value = "auto";
      fields.autoEnabled.checked = true;
      syncProxyModeView();
      const autoSettings = { ...readAutoSettings(), enabled: true };
      const data = await postJson(bootstrap.endpoints.proxyRun, {
        selectedProxyip: finalProxyip,
        settings: autoSettings,
        trigger: "manual-import"
      });
      state.auto = {
        settings: data.settings || autoSettings,
        state: data.state || state.auto?.state || {}
      };
      state.currentProxyip = currentAutoProxyipText(state.auto.state) || finalProxyip.join(",");
      fillAutoForm(state.auto.settings);
      renderAutoState(state.auto.state, state.currentProxyip);
      closeAutoRunDialog();
      setStatus("\u5df2\u5bfc\u5165 " + finalProxyip.length + " \u4e2a IP\u3002", "ok");
    }

    function closeAutoRunDialog() {
      stopAutoRunRequests();
      fields.autoRunDialog.hidden = true;
    }

    function fillAutoForm(settings) {
      fields.autoEnabled.checked = settings.enabled !== false;
      fields.proxyMode.value = fields.autoEnabled.checked ? "auto" : "manual";
      fields.keepCurrentIfHealthy.checked = settings.keepCurrentIfHealthy !== false;
      fields.requireCountryMatch.checked = settings.requireCountryMatch !== false;
      fields.autoHealOnAllFailed.checked = settings.autoHealOnAllFailed !== false;
      state.autoSelectedCountry = "";
      fields.autoCountry.value = "";
      fields.autoPort.value = settings.port || "";
      fields.autoStatus.value = settings.status || "verified,usable";
      fields.autoCandidateLimit.value = settings.candidateLimit ?? 50;
      fields.autoSaveCount.value = settings.saveCount ?? 3;
      fields.failureThreshold.value = settings.failureThreshold ?? 3;
      fields.autoTimeoutMs.value = settings.timeoutMs ?? 1000;
      fields.autoConcurrency.value = settings.concurrency ?? 4;
      fields.autoHealCooldownMinutes.value = settings.autoHealCooldownMinutes ?? 10;
      fields.standbyGroupCount.value = settings.standbyGroupCount ?? 2;
      fields.standbyGroupSize.value = settings.standbyGroupSize ?? 3;
      renderAutoPicker();
      syncProxyModeView();
    }

    function readAutoSettings() {
      return {
        enabled: fields.proxyMode.value === "auto",
        keepCurrentIfHealthy: fields.keepCurrentIfHealthy.checked,
        requireCountryMatch: fields.requireCountryMatch.checked,
        autoHealOnAllFailed: fields.autoHealOnAllFailed.checked,
        ipVersion: state.autoIpVersion,
        country: fields.autoCountry.value.trim().toUpperCase(),
        port: fields.autoPort.value.trim(),
        portMode: fields.autoPort.value.trim() ? "explicit" : "all",
        status: fields.autoStatus.value,
        candidateLimit: normalizedNumber(fields.autoCandidateLimit, 50, 1, 50),
        saveCount: normalizedNumber(fields.autoSaveCount, 3, 1, 10),
        failureThreshold: normalizedNumber(fields.failureThreshold, 3, 1, 10),
        timeoutMs: normalizedNumber(fields.autoTimeoutMs, 1000, 1000, 8000),
        concurrency: normalizedNumber(fields.autoConcurrency, 4, 1, 8),
        autoHealCooldownMinutes: normalizedNumber(fields.autoHealCooldownMinutes, 10, 1, 120),
        standbyGroupCount: normalizedNumber(fields.standbyGroupCount, 2, 1, 5),
        standbyGroupSize: normalizedNumber(fields.standbyGroupSize, 3, 1, 5)
      };
    }

    function formatAutoTime(value) {
      if (!value) return "尚未运行";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function formatAutoResult(autoState) {
      const raw = String(autoState.lastResult || autoState.action || "").trim();
      const labels = {
        ok: "成功",
        success: "成功",
        skipped: "跳过",
        disabled: "未开启",
        error: "失败",
        failed: "失败",
        replace: "已更换",
        keep: "保持当前"
      };
      return labels[raw] || "暂无结果";
    }

    function renderAutoState(autoState, currentProxyip) {
      const standbyCount = Array.isArray(autoState.standbyGroups) ? autoState.standbyGroups.length : 0;
      const lines = [
        "状态：" + (fields.autoEnabled.checked ? "已开启" : "未开启"),
        "上次运行：" + formatAutoTime(autoState.lastRunAt || autoState.finishedAt),
        "上次结果：" + formatAutoResult(autoState),
        "失败次数：" + (autoState.currentFailureCount ?? 0),
        "启动备用：" + standbyCount
      ];
      document.getElementById("autoState").textContent = lines.join("\n");
      document.getElementById("currentProxyip").textContent = currentProxyip || state.currentProxyip || "暂无";
    }

    async function runAuto() {
      if (!requireAutoCountrySelection()) return;
      await openAutoRunDialog();
    }

    function logoutEndpoint() {
      const fallbackBase = bootstrap.adminBase || "/a";
      return new URL(bootstrap.endpoints.logout || (fallbackBase + "/ht/tu"), bootstrap.workerOrigin).href;
    }

    async function logout() {
      setStatus("正在退出登录...");
      const response = await fetch(logoutEndpoint(), {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store"
      });
      if (!response.ok) {
        throw new Error("退出登录失败");
      }
      window.location.href = bootstrap.adminBase;
    }

    function syncAutoPanelWidth() {
      const tabs = Array.from(document.querySelectorAll(".tabs .tab"));
      if (!tabs.length) return;
      const rects = tabs.map((item) => item.getBoundingClientRect()).filter((rect) => rect.width > 0);
      if (!rects.length) return;
      const left = Math.min(...rects.map((rect) => rect.left));
      const right = Math.max(...rects.map((rect) => rect.right));
      const width = Math.ceil(right - left);
      if (width > 0) {
        document.documentElement.style.setProperty("--auto-panel-width", width + "px");
      }
    }

    function bindEvents() {
      syncAutoPanelWidth();
      window.addEventListener("resize", syncAutoPanelWidth);
      if ("ResizeObserver" in window) {
        new ResizeObserver(syncAutoPanelWidth).observe(document.querySelector(".tabs"));
      }
      document.querySelectorAll(".tab").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
          document.querySelectorAll(".view").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          document.getElementById(button.dataset.view).classList.add("active");
          syncAutoPanelWidth();
        });
      });
      document.getElementById("saveConfig").addEventListener("click", () => saveAll().catch(showError));
      document.getElementById("saveEntry").addEventListener("click", () => saveEntry().catch(showError));
      document.getElementById("saveProxyip").addEventListener("click", () => saveProxyip().catch(showError));
      document.getElementById("saveSubName").addEventListener("click", () => saveAll().catch(showError));
      document.getElementById("reloadState").addEventListener("click", () => loadState().catch(showError));
      document.getElementById("logoutButton").addEventListener("click", () => logout().catch(showError));
      document.getElementById("refreshEntries").addEventListener("click", () => refreshEntries().catch(showError));
      document.querySelectorAll(".auto-region-button").forEach((button) => {
        button.addEventListener("click", () => setAutoRegion(button.dataset.autoRegion || ""));
      });
      document.querySelectorAll(".auto-ip-tab").forEach((button) => {
        button.addEventListener("click", () => setAutoIpVersion(button.dataset.autoIpVersion || "4"));
      });
      fields.autoCountryButtons?.addEventListener("click", (event) => {
        const button = event.target.closest("[data-auto-country]");
        if (!button) return;
        selectAutoCountry(button.dataset.autoCountry || "");
      });
      document.getElementById("runAuto").addEventListener("click", () => runAuto().catch(showError));
      fields.autoRunRows.addEventListener("change", (event) => {
        const proxy = event.target?.dataset?.autoRunPick;
        if (!proxy) return;
        toggleAutoRunPick(proxy, event.target.checked);
      });
      fields.autoRunImport.addEventListener("click", () => autoRunImportSelected().catch(showError));
      fields.autoRunCancel.addEventListener("click", closeAutoRunDialog);
      fields.autoRunClose.addEventListener("click", closeAutoRunDialog);
      fields.autoRunDialog.addEventListener("click", (event) => {
        if (event.target?.dataset?.autoRunClose !== undefined) {
          closeAutoRunDialog();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !fields.autoRunDialog.hidden) {
          closeAutoRunDialog();
        }
      });
      fields.proxyMode.addEventListener("change", () => {
        fields.autoEnabled.checked = fields.proxyMode.value === "auto";
        syncProxyModeView();
      });
      fields.autoEnabled.addEventListener("change", () => {
        fields.proxyMode.value = fields.autoEnabled.checked ? "auto" : "manual";
        syncProxyModeView();
      });
      fields.autoCountry.addEventListener("change", () => {
        selectAutoCountry(fields.autoCountry.value);
      });
      fields.autoPort.addEventListener("change", () => {
        fields.autoEnabled.checked = true;
        fields.proxyMode.value = "auto";
        syncProxyModeView();
      });
      ["token", "subName", "host", "uuid", "fingerprint", "proxyMode", "proxyip"].forEach((id) => {
        fields[id]?.addEventListener("input", () => {
          fields.proxyCount.value = countList(fields.proxyip.value);
          renderLinks();
        });
      });
    }

    function showError(error) {
      setStatus(error.message || String(error), "error");
    }

    document.getElementById("originPill").textContent = bootstrap.workerOrigin;
    document.getElementById("entryPill").textContent = bootstrap.adminBase;
    document.getElementById("converterPill").textContent = bootstrap.converterUrl || "converter";

    bindEvents();
    loadState().then(() => loadSummary()).catch(showError);
  </script>
</body>
</html>
